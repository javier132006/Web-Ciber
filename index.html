<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Ondas: descubre música, organiza tus playlists y explora un laboratorio de seguridad web.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%239cff6b'/%3E%3Cpath d='M8 25c7-15 13-15 20 0s13 15 20 0 13-15 20 0M8 40c7-10 13-10 20 0s13 10 20 0 13-10 20 0' fill='none' stroke='%23091410' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Ondas — Tu música, tu mundo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #090d18;
      --bg-soft: #0e1422;
      --sidebar: rgba(13, 19, 33, .94);
      --panel: #121b2c;
      --panel-2: #18243a;
      --panel-3: #202e46;
      --text: #f3f6ff;
      --muted: #8e9ab2;
      --muted-2: #65728b;
      --line: rgba(164, 185, 220, .12);
      --accent: #9cff6b;
      --accent-2: #47e6c1;
      --purple: #a78bfa;
      --danger: #ff7d8b;
      --success: #88efb1;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(900px 600px at 78% -10%, rgba(57, 110, 120, .16), transparent 65%),
        radial-gradient(700px 500px at 2% 100%, rgba(95, 72, 157, .13), transparent 65%),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a { color: inherit; }
    ::selection { background: rgba(156, 255, 107, .28); color: white; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #27344b; border: 2px solid transparent; border-radius: 20px; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app {
      height: 100vh;
      min-height: 620px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 104px;
    }
    .sidebar {
      grid-column: 1;
      grid-row: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 27px 18px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
      z-index: 5;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px;
      margin-bottom: 39px;
      font: 700 27px/1 'Space Grotesk', sans-serif;
      letter-spacing: -1.6px;
    }
    .brand-mark {
      width: 37px; height: 37px; display: grid; place-items: center;
      border-radius: 13px; color: #09130e;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 7px 24px rgba(116, 255, 159, .2);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name span { color: var(--accent); }
    .nav-label {
      color: #5f6d86; text-transform: uppercase; letter-spacing: 1.7px;
      font-size: 10px; font-weight: 700; padding: 0 12px; margin: 0 0 9px;
    }
    .nav-list { display: grid; gap: 5px; }
    .nav-link {
      min-height: 47px; display: flex; align-items: center; gap: 13px;
      padding: 0 13px; border-radius: 13px; text-decoration: none;
      color: var(--muted); font-weight: 600; transition: .2s ease;
      border: 1px solid transparent;
    }
    .nav-link svg { width: 19px; height: 19px; opacity: .82; flex: none; }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,.045); }
    .nav-link.active {
      color: var(--accent); background: linear-gradient(90deg, rgba(156,255,107,.12), rgba(156,255,107,.035));
      border-color: rgba(156,255,107,.09);
    }
    .nav-link.active svg { opacity: 1; }
    .nav-spacer { height: 29px; }
    .sidebar-note {
      margin-top: auto; padding: 15px; border-radius: 17px;
      background: linear-gradient(145deg, rgba(156,255,107,.11), rgba(71,230,193,.045));
      border: 1px solid rgba(156,255,107,.13);
    }
    .sidebar-note .note-icon { color: var(--accent); margin-bottom: 8px; }
    .sidebar-note strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .sidebar-note p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .user-box {
      display: flex; align-items: center; gap: 10px; margin-top: 17px;
      padding: 13px 7px 0; border-top: 1px solid var(--line); min-width: 0;
    }
    .avatar {
      width: 37px; height: 37px; border-radius: 50%; display: grid; place-items: center;
      flex: none; color: #152012; font-weight: 800; font-size: 13px;
      background: linear-gradient(135deg, #c7ff9c, #50dcc0);
    }
    .user-meta { min-width: 0; flex: 1; }
    .user-meta strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-meta span { color: var(--muted); font-size: 10px; }
    .logout {
      width: 33px; height: 33px; display: grid; place-items: center;
      border: 0; border-radius: 10px; color: var(--muted); background: transparent;
    }
    .logout:hover { color: var(--danger); background: rgba(255,125,139,.09); }

    main { grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; overflow: auto; padding: 28px clamp(22px, 4vw, 58px) 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 31px; }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb b { color: var(--text); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 13px;
      background: rgba(255,255,255,.035); color: var(--muted); display: grid; place-items: center;
      transition: .2s ease;
    }
    .icon-btn:hover { background: var(--panel-2); color: var(--text); transform: translateY(-1px); }
    .icon-btn svg { width: 18px; height: 18px; }
    .page-title { font: 700 clamp(27px, 3vw, 38px)/1.15 'Space Grotesk', sans-serif; letter-spacing: -1.2px; margin: 0; }
    .page-subtitle { color: var(--muted); margin: 8px 0 0; font-size: 14px; }
    .eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
    .section { margin-top: 34px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-bottom: 16px; }
    .section-head h2 { font: 600 19px/1.2 'Space Grotesk', sans-serif; letter-spacing: -.4px; margin: 0; }
    .section-head p { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
    .text-link { color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .text-link:hover { color: #c2ff9f; }

    .hero {
      position: relative; overflow: hidden; min-height: 280px; display: flex; align-items: center;
      padding: clamp(24px, 4vw, 44px); border-radius: 25px;
      background: linear-gradient(110deg, #182a35 0%, #1b263e 52%, #32234c 100%);
      border: 1px solid rgba(192,255,224,.13); box-shadow: var(--shadow);
      isolation: isolate;
    }
    .hero::before, .hero::after { content: ''; position: absolute; z-index: -1; border-radius: 50%; filter: blur(1px); }
    .hero::before { width: 370px; height: 370px; right: 9%; top: -155px; background: radial-gradient(circle at 35% 35%, rgba(156,255,107,.72), rgba(71,230,193,.22) 43%, transparent 69%); opacity: .8; }
    .hero::after { width: 280px; height: 280px; right: -20px; bottom: -190px; background: rgba(167,139,250,.28); filter: blur(30px); }
    .hero-content { max-width: 510px; position: relative; z-index: 2; }
    .hero h1 { font: 700 clamp(31px, 4vw, 48px)/1.06 'Space Grotesk', sans-serif; letter-spacing: -2px; margin: 12px 0; }
    .hero h1 span { color: var(--accent); }
    .hero p { max-width: 400px; color: #b6c5d2; margin: 0 0 23px; font-size: 14px; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 11px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 43px; padding: 0 19px; border: 0; border-radius: 999px;
      font-weight: 800; font-size: 12px; text-decoration: none; transition: .2s ease;
    }
    .btn-primary { color: #0a160e; background: var(--accent); box-shadow: 0 8px 22px rgba(156,255,107,.16); }
    .btn-primary:hover { background: #b7ff91; transform: translateY(-2px); box-shadow: 0 12px 28px rgba(156,255,107,.22); }
    .btn-secondary { color: var(--text); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); }
    .btn-secondary:hover { background: rgba(255,255,255,.17); }
    .hero-visual { position: absolute; right: 8%; top: 50%; transform: translateY(-50%) rotate(-8deg); width: 205px; height: 205px; z-index: 1; }
    .hero-disc {
      width: 100%; height: 100%; border-radius: 50%; position: relative;
      background: repeating-radial-gradient(circle, #101924 0 2px, #202d3a 3px 4px, #121b27 5px 8px);
      box-shadow: 0 22px 55px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08);
      animation: slowspin 22s linear infinite;
    }
    .hero-disc::before { content: ''; position: absolute; inset: 29%; border-radius: 50%; background: conic-gradient(from 20deg, #a7ff75, #43dbbd, #a78bfa, #a7ff75); box-shadow: 0 0 40px rgba(156,255,107,.3); }
    .hero-disc::after { content: ''; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: #0b111a; border: 2px solid rgba(255,255,255,.7); top: 50%; left: 50%; transform: translate(-50%,-50%); }
    @keyframes slowspin { to { transform: rotate(360deg); } }

    .quick-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; margin-top: 19px; }
    .stat-card { display: flex; align-items: center; gap: 13px; padding: 15px 17px; border-radius: 16px; border: 1px solid var(--line); background: rgba(18,27,44,.72); }
    .stat-icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--accent); background: rgba(156,255,107,.09); flex: none; }
    .stat-icon svg { width: 18px; height: 18px; }
    .stat-card strong { display: block; font: 700 19px/1.2 'Space Grotesk', sans-serif; }
    .stat-card span { color: var(--muted); font-size: 11px; }

    .music-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 15px; }
    .music-card { min-width: 0; padding: 12px; border: 1px solid transparent; border-radius: 17px; background: rgba(18,27,44,.72); transition: .23s ease; cursor: pointer; position: relative; }
    .music-card:hover { background: #17243a; border-color: var(--line); transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.19); }
    .cover { position: relative; aspect-ratio: 1; width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 12px; isolation: isolate; }
    .cover::before, .cover::after { content: ''; position: absolute; inset: 0; }
    .cover::before { background: var(--cover); }
    .cover::after { opacity: .8; background: radial-gradient(circle at 28% 22%, rgba(255,255,255,.52), transparent 19%), linear-gradient(140deg, transparent 36%, rgba(0,0,0,.32)); mix-blend-mode: screen; }
    .cover-art { position: absolute; z-index: 1; inset: 0; display: grid; place-items: center; }
    .cover-art svg { width: 44%; height: 44%; color: rgba(255,255,255,.85); filter: drop-shadow(0 5px 14px rgba(0,0,0,.22)); }
    .cover .cover-tag { position: absolute; z-index: 2; left: 9px; bottom: 9px; padding: 4px 7px; border-radius: 6px; color: white; background: rgba(8,13,22,.42); backdrop-filter: blur(8px); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }
    .music-card .track-title, .track-info .track-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; font-size: 13px; }
    .music-card .artist, .track-info .artist { color: var(--muted); font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 9px; }
    .tag { padding: 4px 7px; border-radius: 6px; color: #b5c1d4; background: rgba(255,255,255,.055); font-size: 9px; }
    .heart-btn { border: 0; background: transparent; color: var(--muted); padding: 5px; display: grid; place-items: center; }
    .heart-btn:hover, .heart-btn.liked { color: #ff8297; }
    .heart-btn svg { width: 16px; height: 16px; }

    .track-list { display: grid; gap: 3px; }
    .track-row { display: flex; align-items: center; gap: 13px; padding: 9px 12px; border-radius: 12px; cursor: pointer; transition: .18s ease; min-width: 0; }
    .track-row:hover { background: rgba(255,255,255,.045); }
    .track-row .cover { width: 45px; height: 45px; aspect-ratio: 1; border-radius: 9px; margin: 0; flex: none; }
    .track-number { width: 19px; text-align: center; color: var(--muted-2); font-size: 11px; }
    .track-info { min-width: 0; flex: 1; }
    .track-album { width: 22%; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-duration { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; width: 42px; text-align: right; }
    .track-row .heart-btn { margin-left: 3px; }

    .search-box { max-width: 630px; position: relative; margin-top: 25px; }
    .search-box svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); pointer-events: none; }
    .field { width: 100%; height: 53px; border: 1px solid var(--line); border-radius: 15px; background: rgba(18,27,44,.9); color: var(--text); padding: 0 17px 0 49px; outline: none; transition: .2s ease; }
    .field:focus { border-color: rgba(156,255,107,.45); box-shadow: 0 0 0 4px rgba(156,255,107,.07); }
    .field::placeholder { color: #66748d; }
    .search-submit { position: absolute; top: 7px; right: 7px; height: 39px; padding: 0 15px; }
    .result-label { margin: 23px 0 12px; color: var(--muted); font-size: 12px; }

    .panel { background: rgba(18,27,44,.78); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .form-row { display: flex; gap: 10px; max-width: 620px; margin: 22px 0; }
    .form-row .field { padding-left: 15px; flex: 1; min-width: 0; }
    .playlist-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 15px; }
    .playlist-card { padding: 13px; background: rgba(18,27,44,.76); border: 1px solid var(--line); border-radius: 17px; min-width: 0; }
    .playlist-art { height: 132px; border-radius: 11px; margin-bottom: 12px; display: flex; align-items: end; padding: 13px; position: relative; overflow: hidden; background: linear-gradient(135deg,#9eff75,#2f9e99 56%,#4853a3); }
    .playlist-art::before { content:''; position:absolute; width:140px;height:140px;border:1px solid rgba(255,255,255,.3);border-radius:50%;right:-16px;top:-40px;box-shadow:0 0 0 13px rgba(255,255,255,.06),0 0 0 27px rgba(255,255,255,.05); }
    .playlist-art span { position: relative; z-index: 1; font:700 17px/1.1 'Space Grotesk',sans-serif; max-width: 80%; text-shadow: 0 2px 8px rgba(0,0,0,.18); }
    .playlist-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .playlist-meta strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
    .playlist-meta small { color: var(--muted); font-size: 10px; }
    .delete-playlist { border:0; background:transparent; color:var(--muted); padding:7px; border-radius:8px; }
    .delete-playlist:hover { color:var(--danger); background:rgba(255,125,139,.08); }
    .empty-state { text-align: center; padding: 55px 20px; border-radius: 18px; border: 1px dashed rgba(164,185,220,.2); color: var(--muted); }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-state h3 { color: var(--text); margin: 4px 0; font: 600 18px 'Space Grotesk',sans-serif; }
    .empty-state p { margin: 3px 0 15px; font-size: 12px; }

    .profile-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(250px, .8fr); gap: 18px; margin-top: 25px; max-width: 900px; }
    .profile-head { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; }
    .profile-avatar { width: 65px; height: 65px; border-radius: 20px; display:grid;place-items:center; font:700 24px 'Space Grotesk',sans-serif; color:#102016; background:linear-gradient(135deg,#b9ff8d,#42d7bf); }
    .profile-head h2 { font:700 21px 'Space Grotesk',sans-serif; margin:0; }
    .profile-head p { color:var(--muted);font-size:12px;margin:3px 0 0; }
    .profile-field { margin-top: 15px; }
    .profile-field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 7px; }
    .private-note { border-color: rgba(255,125,139,.17); background: linear-gradient(145deg,rgba(255,125,139,.06),rgba(18,27,44,.8)); }
    .private-note h3 { display:flex;align-items:center;gap:8px;font:600 14px 'Space Grotesk',sans-serif;margin:0 0 9px; }
    .private-note p { color:#b9c1d0;font-size:12px;margin:0; }

    .table-wrap { overflow-x: auto; margin-top: 20px; border: 1px solid var(--line); border-radius: 15px; background: rgba(18,27,44,.7); }
    table { border-collapse: collapse; width: 100%; min-width: 570px; font-size: 12px; }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); background: rgba(255,255,255,.025); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    tr:last-child td { border-bottom: 0; }
    td { color: #c9d2e1; }
    code { color: var(--accent); background: rgba(156,255,107,.08); padding: 3px 6px; border-radius: 5px; font-size: .9em; }
    .role-pill { display: inline-flex; padding: 4px 8px; border-radius: 99px; color: var(--accent); background: rgba(156,255,107,.09); font-size: 10px; }
    .challenge-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; margin-top: 23px; }
    .challenge-card { padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: rgba(18,27,44,.76); }
    .challenge-card .challenge-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .challenge-number { color:var(--accent);font:700 11px 'Space Grotesk',sans-serif;letter-spacing:1px; }
    .challenge-card h3 { font:600 14px 'Space Grotesk',sans-serif; margin:0 0 5px; }
    .challenge-card p { color:var(--muted);font-size:11px;line-height:1.6;margin:0; }
    .challenge-status { color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px; }
    .challenge-status.done { color:var(--success); }
    .hint-box { margin-top: 20px; padding: 17px 19px; border: 1px solid rgba(167,139,250,.2); border-radius: 15px; background: rgba(167,139,250,.055); }
    .hint-box h3 { font:600 13px 'Space Grotesk',sans-serif;margin:0 0 7px;color:#c7b7ff; }
    .hint-box p { color:var(--muted);font-size:11px;margin:5px 0;line-height:1.7; }
    .message { margin-top: 10px; font-size: 12px; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    .player {
      grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(190px, 1fr) minmax(260px, 1.5fr) minmax(190px, 1fr);
      align-items: center; gap: 20px; padding: 13px 27px; z-index: 10;
      background: rgba(13,19,32,.97); border-top: 1px solid rgba(164,185,220,.14); backdrop-filter: blur(22px);
      box-shadow: 0 -12px 40px rgba(0,0,0,.16);
    }
    .now-playing { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .now-playing .cover { width: 49px; height: 49px; flex: none; border-radius: 9px; margin: 0; }
    .now-playing .track-info { min-width: 0; }
    .now-playing .track-title { font-size: 12px; }
    .now-playing .artist { font-size: 10px; }
    .player-center { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
    .control-btn { border: 0; padding: 5px; display: grid; place-items:center; color: #8794a9; background: transparent; transition:.15s ease; }
    .control-btn:hover, .control-btn.active { color: var(--accent); }
    .control-btn svg { width: 16px; height: 16px; }
    .play-btn { width: 36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--text);color:#0a111d;transition:.2s ease; }
    .play-btn:hover { transform:scale(1.07);background:var(--accent); }
    .play-btn svg { width: 16px;height:16px; }
    .progress-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; color: var(--muted-2); font: 10px 'DM Sans',sans-serif; font-variant-numeric: tabular-nums; }
    .progress-track { height: 4px; flex: 1; background: #2a3549; border-radius: 99px; overflow: hidden; cursor: pointer; }
    .progress-fill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg,var(--accent),var(--accent-2)); transition: width .25s linear; }

    const icon = (name, size = 20) => {
      const paths = {
        wave: '<path d="M2 12c2.5-7 5.5-7 8 0s5.5 7 8 0 5.5-7 8 0"/><path d="M2 18c2.5-4 5.5-4 8 0s5.5 4 8 0 5.5-4 8 0"/>',

        palette: '<path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.7 1.7 0 0 1 1.3-2.8H18a3 3 0 0 0 3-3c0-5-4-8.9-9-8.9Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="11" cy="6.8" r="1"/><circle cx="15.5" cy="8" r="1"/>',
        queue: '<path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 16 3 2-3 2"/>',

      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.music}</svg>`;
    };

    function coverHTML(index, small = false) {
      const track = TRACKS[index] || TRACKS[0];
      return `<div class="cover" style="--cover:${COVER_GRADIENTS[index % COVER_GRADIENTS.length]}"><div class="cover-art">${icon('wave', small ? 26 : 42)}</div><span class="cover-tag">${track[3]}</span></div>`;
    }

    let currentTrack = 0;
    let position = 0;
    let playing = false;
    let timer = null;
    let shuffle = false;
    let repeat = false;
    let toastTimer = null;

    function notify(message) {
      const toast = $('#toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function rememberTrack() {
      store.setItem('ondas_player_state', JSON.stringify({ track: currentTrack, position, playing: false }));
    }

    function setTrack(index, keepQueue = false) {
      currentTrack = (index + TRACKS.length) % TRACKS.length;
      if (keepQueue && currentQueue.length) {
        const found = currentQueue.indexOf(currentTrack);
        if (found >= 0) queuePosition = found;
      } else {
        currentQueue = [];
        queuePosition = -1;
      }
      position = 0;
      playing = true;
      const recent = getRecent().filter(i => i !== currentTrack);
      recent.unshift(currentTrack);
      store.setItem('ondas_recent', JSON.stringify(recent.slice(0, 8)));
      rememberTrack();
      tick();
      drawPlayer();
      document.querySelectorAll('[data-track]').forEach(node => node.classList.toggle('is-playing', Number(node.dataset.track) === currentTrack));
      notify(`Reproduciendo: ${TRACKS[currentTrack][0]}`);
    }

    function playQueue(items, startAt = 0) {
      const valid = items.filter(index => Number.isInteger(index) && TRACKS[index]);
      if (!valid.length) return notify('Esta cola todavía no tiene canciones.');
      currentQueue = [...valid];
      queuePosition = Math.max(0, Math.min(startAt, currentQueue.length - 1));
      setTrack(currentQueue[queuePosition], true);
    }

    function nextTrack() {
      if (currentQueue.length) {
        if (shuffle && currentQueue.length > 1) {
          let next = queuePosition;
          while (next === queuePosition) next = Math.floor(Math.random() * currentQueue.length);
          queuePosition = next;
        } else if (queuePosition < currentQueue.length - 1) queuePosition += 1;
        else if (repeat) queuePosition = 0;
        else { playing = false; tick(); drawPlayer(); rememberTrack(); return; }
        setTrack(currentQueue[queuePosition], true);
        return;
      }
      if (shuffle) {
        let next = currentTrack;
        while (TRACKS.length > 1 && next === currentTrack) next = Math.floor(Math.random() * TRACKS.length);
        setTrack(next);
      } else if (repeat) setTrack(currentTrack);
      else if (currentTrack < TRACKS.length - 1) setTrack(currentTrack + 1);
      else { playing = false; tick(); drawPlayer(); rememberTrack(); }
    }

    function previousTrack() {
      if (position > 3) { position = 0; updateProgress(); rememberTrack(); return; }
      if (currentQueue.length && queuePosition > 0) {
        queuePosition -= 1;
        setTrack(currentQueue[queuePosition], true);
      } else setTrack(currentTrack > 0 ? currentTrack - 1 : 0, !!currentQueue.length);
    }

    function tick() {
      clearInterval(timer);
      if (!playing) return;
      timer = setInterval(() => {
        position += 1;
        if (position >= TRACKS[currentTrack][2]) {
          if (repeat && !currentQueue.length) position = 0;
          else return nextTrack();
        }
        updateProgress();
        if (position % 5 === 0) rememberTrack();
      }, 1000);
    }

    function updateProgress() {
      const fill = $('#progress-fill');
      const current = $('#current-time');
      if (fill) fill.style.width = `${(position / TRACKS[currentTrack][2]) * 100}%`;
      if (current) current.textContent = fmt(position);
    }

    function drawPlayer() {
      const player = $('#player');
      if (!player) return;
      const track = TRACKS[currentTrack];
      player.innerHTML = `
        <div class="now-playing">
          ${coverHTML(currentTrack, true)}
          <div class="track-info"><div class="track-title">${track[0]}</div><div class="artist">${track[1]}</div></div>
          <button class="heart-btn ${getLikes().includes(currentTrack) ? 'liked' : ''}" id="player-like" aria-label="Añadir a favoritos">${icon('heart')}</button>
        </div>
        <div class="player-center">
          <div class="player-controls">
            <button class="control-btn ${shuffle ? 'active' : ''}" data-action="shuffle" aria-label="Aleatorio">${icon('shuffle')}</button>
            <button class="control-btn" id="previous-track" aria-label="Anterior">${icon('prev')}</button>
            <button class="play-btn" id="play-toggle" aria-label="${playing ? 'Pausar' : 'Reproducir'}">${icon(playing ? 'pause' : 'play')}</button>
            <button class="control-btn" id="next-track" aria-label="Siguiente">${icon('next')}</button>
            <button class="control-btn ${repeat ? 'active' : ''}" data-action="repeat" aria-label="Repetir">${icon('repeat')}</button>
          </div>
          <div class="progress-row"><span id="current-time">${fmt(position)}</span><div class="progress-track" id="progress-track" role="slider" tabindex="0" aria-label="Progreso de reproducción" aria-valuemin="0" aria-valuemax="${track[2]}" aria-valuenow="${position}"><div class="progress-fill" id="progress-fill"></div></div><span>${fmt(track[2])}</span></div>
        </div>
        <div class="player-extra"><div class="equalizer ${playing ? 'active' : ''}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button class="control-btn" id="queue-open" aria-label="Ver cola de reproducción" title="Cola de reproducción">${icon('queue')}</button><span class="demo-pill">DEMO · SIN AUDIO</span></div>`;

      $('#play-toggle').onclick = () => { playing = !playing; tick(); rememberTrack(); drawPlayer(); };
      $('#previous-track').onclick = previousTrack;
      $('#next-track').onclick = nextTrack;
      $('[data-action="shuffle"]').onclick = () => { shuffle = !shuffle; drawPlayer(); notify(shuffle ? 'Modo aleatorio activado' : 'Modo aleatorio desactivado'); };
      $('[data-action="repeat"]').onclick = () => { repeat = !repeat; drawPlayer(); notify(repeat ? 'Repetición activada' : 'Repetición desactivada'); };
      $('#player-like').onclick = () => toggleLike(currentTrack);
      $('#queue-open').onclick = openQueue;
      const seek = event => {
        const rect = event.currentTarget.getBoundingClientRect();
        position = Math.max(0, Math.min(TRACKS[currentTrack][2], Math.floor(((event.clientX - rect.left) / rect.width) * TRACKS[currentTrack][2])));
        updateProgress(); rememberTrack();
      };
      $('#progress-track').onclick = seek;
      $('#progress-track').onkeydown = event => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); position = Math.max(0, Math.min(track[2], position + (event.key === 'ArrowRight' ? 5 : -5))); updateProgress(); rememberTrack(); }
      };
      updateProgress();
    }

    function openQueue() {
      const items = currentQueue.length ? currentQueue : [currentTrack, ...TRACKS.map((_, i) => i).filter(i => i !== currentTrack)];
      const backdrop = $('#settings-backdrop');
      if (!backdrop) return;
      const card = backdrop.querySelector('.settings-card');
      card.innerHTML = `<div class="settings-head"><div><div class="eyebrow">Ahora suena</div><h2>Cola de reproducción</h2></div><button class="icon-btn" id="settings-close" aria-label="Cerrar cola">✕</button></div><p>${currentQueue.length ? 'Orden de tu playlist actual.' : 'No hay una playlist activa. Sigue el catálogo en orden.'}</p><div class="queue-list">${items.map((index, n) => `<div class="track-row ${index === currentTrack ? 'is-playing' : ''}" data-queue-play="${n}" data-track="${index}">${index === currentTrack ? '<span class="queue-current">SONANDO</span>' : `<span class="track-number">${String(n + 1).padStart(2,'0')}</span>`}${coverHTML(index,true)}<div class="track-info"><div class="track-title">${TRACKS[index][0]}</div><div class="artist">${TRACKS[index][1]}</div></div><span class="track-duration">${fmt(TRACKS[index][2])}</span></div>`).join('')}</div><div class="settings-footer"><button class="btn btn-secondary" id="settings-done">Cerrar</button></div>`;
      backdrop.classList.add('open');
      const close = () => backdrop.classList.remove('open');
      $('#settings-close').onclick = close; $('#settings-done').onclick = close;
      card.querySelectorAll('[data-queue-play]').forEach(row => row.onclick = () => {
        if (currentQueue.length) { queuePosition = Number(row.dataset.queuePlay); setTrack(Number(row.dataset.track), true); }
        else setTrack(Number(row.dataset.track));
        close();
      });
    }

    function toggleLike(index) {
      const likes = getLikes();
      const at = likes.indexOf(index);
      if (at >= 0) likes.splice(at, 1); else likes.push(index);
      store.setItem('ondas_likes', JSON.stringify(likes));
      if ($('#player')) drawPlayer();
      if (location.hash === '#favoritas') render();
      else document.querySelectorAll(`[data-like="${index}"]`).forEach(button => button.classList.toggle('liked', likes.includes(index)));
      notify(likes.includes(index) ? 'Añadida a tus favoritos' : 'Eliminada de tus favoritos');
    }

    function trackRow(index, number = '', queueIndex = null) {
      const track = TRACKS[index];
      const playingClass = playing && currentTrack === index ? 'is-playing' : '';
      return `<div class="track-row ${playingClass}" data-track="${index}" ${queueIndex === null ? '' : `data-queue-position="${queueIndex}"`} role="button" tabindex="0" aria-label="Reproducir ${track[0]}">
        <span class="track-number">${playingClass ? '<span class="playing-bars"><i></i><i></i><i></i></span>' : (number || '♫')}</span>${coverHTML(index, true)}
        <div class="track-info"><div class="track-title">${track[0]}</div><div class="artist">${track[1]}</div></div>
        <div class="track-album">${track[4]}</div><button class="heart-btn ${getLikes().includes(index) ? 'liked' : ''}" data-like="${index}" aria-label="Favorito">${icon('heart')}</button>

    }

    function musicCard(index) {
      const track = TRACKS[index];

      return `<article class="music-card ${playingClass}" data-track="${index}" tabindex="0" role="button" aria-label="Reproducir ${track[0]}">

    function bindTracks() {
      document.querySelectorAll('[data-track]').forEach(element => {
        const play = () => {
          const index = Number(element.dataset.track);
          if (element.dataset.queuePosition !== undefined && currentQueue.length) setTrack(index, true);
          else setTrack(index);
        };
        element.addEventListener('click', event => {
          if (event.target.closest('button')) return;
          play();
        });
        element.addEventListener('keydown', event => {
          if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('button')) { event.preventDefault(); play(); }
        });
      });
      document.querySelectorAll('[data-like]').forEach(button => {
        button.addEventListener('click', event => { event.stopPropagation(); toggleLike(Number(button.dataset.like)); });
      });
    }

          <div class="stat-card"><div class="stat-icon">${icon('library')}</div><div><strong>${getPlaylists().length}</strong><span>Tus playlists</span></div></div>
        </div>
        <section class="section"><div class="section-head"><div><h2>${recent.length ? 'Sigue escuchando' : 'Selección para ti'}</h2><p>Una pequeña selección para darle ritmo al día.</p></div><a class="text-link" href="#buscar">Ver todo ${icon('arrow',12)}</a></div>
          <div class="music-grid">${picks.map(musicCard).join('')}</div></section>
        <section class="section"><div class="section-head"><div><h2>¿Qué ambiente buscas?</h2><p>Elige el mood y encuentra tu próxima banda sonora.</p></div></div><div class="mood-grid"><a class="mood-tile" href="#q=Synthwave" style="--mood:linear-gradient(135deg,#ed856e,#713c91)"><span>Modo noche</span><small>Synthwave · Electrónica</small></a><a class="mood-tile" href="#q=Indie" style="--mood:linear-gradient(135deg,#e6ae68,#a44d64)"><span>Sin prisa</span><small>Indie · Acústico</small></a><a class="mood-tile" href="#q=House" style="--mood:linear-gradient(135deg,#42b9a8,#355888)"><span>En movimiento</span><small>House · Techno</small></a><a class="mood-tile" href="#q=Lo-fi" style="--mood:linear-gradient(135deg,#8d86df,#49518f)"><span>Concentración</span><small>Lo-fi · Dream pop</small></a></div></section>
        <section class="section"><div class="section-head"><div><h2>Para descubrir</h2><p>Sonidos diferentes, nuevas obsesiones.</p></div><span class="tag">${TRACKS.length} TRACKS</span></div><div class="track-list">${TRACKS.slice(0, 8).map((_, i) => trackRow(i, String(i + 1).padStart(2, '0'))).join('')}</div></section>`);
      $('#start-mix').onclick = () => setTrack(picks[0]);
    }

    function viewSearch(query = '') {
      const genres = ['Todos', ...new Set(TRACKS.map(track => track[3]))];
      const normalized = query.trim().toLowerCase();
      const hits = TRACKS.map((track, index) => index).filter(index => {
        const track = TRACKS[index];
        const matchesQuery = !normalized || (track[0] + ' ' + track[1] + ' ' + track[3] + ' ' + track[4]).toLowerCase().includes(normalized);
        const matchesGenre = activeGenre === 'Todos' || track[3] === activeGenre;
        return matchesQuery && matchesGenre;
      });
      // VULNERABLE: el término se inserta como HTML sin escapar (XSS basado en DOM).
      shell('buscar', `<div class="eyebrow">Encuentra tu próximo favorito</div><h1 class="page-title">Buscar música</h1><p class="page-subtitle">Busca por canción, artista, álbum o estilo. Siempre hay algo nuevo que descubrir.</p>
        <form id="search-form" class="search-box"><span>${icon('search')}</span><input class="field" id="search-query" placeholder="¿Qué te apetece escuchar?" value=""><button class="btn btn-primary search-submit" type="submit">Buscar</button></form>
        <div class="filter-strip" aria-label="Filtrar por género">${genres.map(genre => `<button class="filter-chip ${activeGenre === genre ? 'active' : ''}" data-genre="${genre}">${genre}</button>`).join('')}</div>
        ${query || activeGenre !== 'Todos' ? `<p class="result-label">${hits.length} resultado(s) ${query ? `para: <strong>${query}</strong>` : ''}</p>` : `<section class="section"><div class="section-head"><div><h2>Selección editorial</h2><p>Una mezcla de sonidos para empezar a explorar.</p></div></div><div class="music-grid">${[0,3,5,8].map(musicCard).join('')}</div></section>`}
        ${hits.length ? `<div class="track-list">${hits.map((index, n) => trackRow(index, String(n + 1).padStart(2, '0'))).join('')}</div>` : `<div class="empty-state"><div class="empty-icon">⌕</div><h3>No hemos encontrado nada</h3><p>Prueba con otro nombre o cambia el género seleccionado.</p><button class="btn btn-secondary" id="clear-filters">Limpiar filtros</button></div>`}`);
      $('#search-form').onsubmit = event => { event.preventDefault(); location.hash = '#q=' + encodeURIComponent($('#search-query').value.trim()); };
      $('#search-query').value = query;
      document.querySelectorAll('[data-genre]').forEach(button => button.onclick = () => { activeGenre = button.dataset.genre; viewSearch(query); });
      $('#clear-filters')?.addEventListener('click', () => { activeGenre = 'Todos'; location.hash = '#buscar'; viewSearch(''); });
    }

    function viewLibrary() {
      const playlists = getPlaylists();
      shell('biblioteca', `<div class="eyebrow">Todo lo que guardas, en un mismo sitio</div><h1 class="page-title">Tu biblioteca</h1><p class="page-subtitle">Tus colecciones personales, listas para cada momento.</p>
        <form id="playlist-form" class="form-row"><input class="field" id="playlist-name" maxlength="50" placeholder="Ponle nombre a una nueva playlist..."><button class="btn btn-primary" type="submit">${icon('plus',16)} Crear playlist</button></form>
        <div class="section-head"><div><h2>Tus playlists</h2><p>${playlists.length} colecciones creadas</p></div></div>
        <div class="playlist-grid">${playlists.map((list, index) => `<article class="playlist-card"><a href="#playlist=${index}" style="text-decoration:none;display:block"><div class="playlist-art" style="background:${['linear-gradient(135deg,#a9f66d,#2c9b94 58%,#343f83)','linear-gradient(135deg,#f7a66e,#b74d80 58%,#482d75)','linear-gradient(135deg,#84d8e3,#5573bd 58%,#453b87)'][index % 3]}"><span>${list.name}</span></div></a><div class="playlist-meta"><div style="min-width:0"><strong>${list.name}</strong><small>${list.t.length} canciones</small></div><button class="delete-playlist" data-delete="${index}" title="Eliminar playlist" aria-label="Eliminar playlist">${icon('trash',16)}</button></div></article>`).join('') || `<div class="empty-state"><h3>Aún no tienes playlists</h3><p>Crea tu primera colección para organizar tus canciones.</p></div>`}</div>`);
      $('#playlist-form').onsubmit = event => {
        event.preventDefault();
        const name = $('#playlist-name').value.trim();
        if (!name) return notify('Escribe un nombre para la playlist.');
        const lists = getPlaylists();
        lists.push({ name, t: [] });
        store.setItem('ondas_playlists', JSON.stringify(lists));
        notify('Playlist creada correctamente.');
        viewLibrary();
      };
      document.querySelectorAll('[data-delete]').forEach(button => button.onclick = event => {
        event.preventDefault(); event.stopPropagation();
        const lists = getPlaylists(); lists.splice(Number(button.dataset.delete), 1);
        store.setItem('ondas_playlists', JSON.stringify(lists)); viewLibrary(); notify('Playlist eliminada.');
      });
    }

    function viewPlaylist(index) {
      const lists = getPlaylists();
      const list = lists[index];
      if (!list) return viewLibrary();
      const validTracks = list.t.filter(trackIndex => Number.isInteger(trackIndex) && TRACKS[trackIndex]);
      shell('biblioteca', `<div class="eyebrow">Tu colección personal</div><h1 class="page-title">${list.name}</h1><p class="page-subtitle">${validTracks.length} canciones · Una playlist hecha a tu manera.</p>
        <div class="playlist-actions"><button class="btn btn-primary" id="play-list">${icon('play',15)} Reproducir playlist</button><button class="btn btn-secondary" id="shuffle-list">${icon('shuffle',15)} Mezclar</button><a class="btn btn-secondary" href="#biblioteca">Volver a biblioteca</a></div>
        <form class="add-song-row" id="add-song-form"><select class="field" id="song-to-add" aria-label="Seleccionar canción">${TRACKS.map((track, trackIndex) => `<option value="${trackIndex}">${track[0]} — ${track[1]}</option>`).join('')}</select><button class="btn btn-primary" type="submit">${icon('plus',15)} Añadir canción</button></form>
        <section class="section"><div class="section-head"><div><h2>Canciones de la playlist</h2><p>Puedes quitar temas cuando quieras.</p></div></div><div class="track-list">${validTracks.map((trackIndex, n) => trackRow(trackIndex, String(n + 1).padStart(2, '0'), n)).join('') || '<div class="empty-state"><h3>Esta playlist está vacía</h3><p>Añade canciones con el selector de arriba.</p></div>'}</div></section>`);
      $('#play-list').onclick = () => playQueue(validTracks);
      $('#shuffle-list').onclick = () => { shuffle = true; playQueue([...validTracks].sort(() => Math.random() - .5)); };
      $('#add-song-form').onsubmit = event => {
        event.preventDefault();
        const selected = Number($('#song-to-add').value);
        const fresh = getPlaylists();
        if (fresh[index].t.includes(selected)) return notify('Esa canción ya está en la playlist.');
        fresh[index].t.push(selected); store.setItem('ondas_playlists', JSON.stringify(fresh));
        notify('Canción añadida a la playlist.'); viewPlaylist(index);
      };
      document.querySelectorAll('[data-remove-song]').forEach(button => button.onclick = event => {
        event.stopPropagation(); const fresh = getPlaylists(); fresh[index].t.splice(Number(button.dataset.removeSong), 1);
        store.setItem('ondas_playlists', JSON.stringify(fresh)); notify('Canción eliminada de la playlist.'); viewPlaylist(index);
      });
    }

    function viewFavourites() {
      const likes = getLikes();
      shell('favoritas', `<div class="eyebrow">Tus imprescindibles</div><h1 class="page-title">Me gusta</h1><p class="page-subtitle">Todas las canciones que has marcado como favoritas.</p>
        <section class="section">${likes.length ? `<div class="track-list">${likes.map((index, n) => trackRow(index, String(n + 1).padStart(2, '0'))).join('')}</div>` : `<div class="empty-state"><div class="empty-icon">♡</div><h3>Tu lista está esperando</h3><p>Marca el corazón de cualquier canción y aparecerá aquí.</p><a href="#buscar" class="btn btn-secondary">Descubrir música</a></div>`}</section>`);
    }

    function viewProfile(id) {
      // VULNERABLE (IDOR): no se comprueba en servidor que el perfil solicitado sea el del usuario.
      const account = USERS.find(user => user.id === id);
      const mine = getSession().id === id;
      shell(`perfil=${getSession().id}`, !account ? `<h1 class="page-title">Perfil</h1><p class="message error">No existe ese usuario.</p>` : `
        <div class="eyebrow">Tu identidad en Ondas</div><h1 class="page-title">Mi perfil</h1><p class="page-subtitle">Gestiona tu información y tus preferencias personales.</p>
        <div class="profile-layout"><section class="panel"><div class="profile-head"><div class="profile-avatar">${account.user.slice(0,1).toUpperCase()}</div><div><h2>${account.user}</h2><p>Miembro de Ondas · Perfil #${account.id}</p></div></div>
          <div class="profile-field"><label>Biografía</label><div id="profile-bio" style="font-size:13px;color:#d6dfec">${store.getItem('ondas_bio_' + id) || account.bio}</div></div>
          ${mine ? `<form id="bio-form" class="profile-field"><label for="new-bio">Actualizar biografía</label><div style="display:flex;gap:8px"><input class="field" id="new-bio" placeholder="Cuéntanos algo sobre ti..."><button class="btn btn-primary" type="submit">Guardar</button></div></form>` : ''}
        </section><aside class="panel private-note"><h3>${icon('lock',16)} Notas privadas</h3><p>${account.private}</p><p style="margin-top:13px;color:#7e899b;font-size:10px">Esta información debería estar protegida por controles de acceso del servidor.</p></aside></div>`);
      if (mine) $('#bio-form').onsubmit = event => { event.preventDefault(); store.setItem('ondas_bio_' + id, $('#new-bio').value); viewProfile(id); notify('Tu biografía se ha actualizado.'); };
    }

    function viewAdmin() {
      // VULNERABLE: el control de acceso depende de un rol editable en localStorage.
      if (getSession().role !== 'admin') return shell('inicio', `<div class="eyebrow">Zona restringida</div><h1 class="page-title">Acceso denegado</h1><p class="page-subtitle">Esta sección está reservada para administradores.</p><div class="panel" style="margin-top:24px;max-width:560px"><p class="message error">No tienes permisos para acceder a este panel.</p><a class="btn btn-secondary" href="#inicio">Volver al inicio</a></div>`);
      shell('admin', `<div class="eyebrow">Centro de control</div><h1 class="page-title">Panel de administración</h1><p class="page-subtitle">Vista interna de las cuentas registradas en el laboratorio.</p>
        <div class="quick-stats" style="max-width:650px"><div class="stat-card"><div class="stat-icon">${icon('user')}</div><div><strong>${USERS.length}</strong><span>Usuarios registrados</span></div></div><div class="stat-card"><div class="stat-icon">${icon('shield')}</div><div><strong>1</strong><span>Cuenta admin</span></div></div><div class="stat-card"><div class="stat-icon">${icon('music')}</div><div><strong>${TRACKS.length}</strong><span>Temas en catálogo</span></div></div></div>
        <div class="panel" style="margin-top:20px;max-width:650px"><div class="eyebrow">Mensaje del sistema</div><p class="message success" style="font-size:13px">${atob('RkxBR3tlbF9yb2xfbm9fc2VfZ3VhcmRhX2VuX2VsX2NsaWVudGV9')}</p></div>
        <div class="section-head" style="margin-top:25px"><div><h2>Usuarios de Ondas</h2><p>Datos de ejemplo visibles desde el cliente.</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Usuario</th><th>Contraseña</th><th>Permisos</th></tr></thead><tbody>${USERS.map(user => `<tr><td>${user.id}</td><td>${user.user}</td><td><code>${user.pass}</code></td><td><span class="role-pill">${user.role}</span></td></tr>`).join('')}</tbody></table></div>`);
    }

    function viewChallenges() {
      const challenges = [
        ['01','Código fuente','Localiza una cuenta con más permisos. La primera bandera está escondida en el propio código.'],
        ['02','Control de acceso','Accede al panel de administración desde la cuenta ana sin conocer otra contraseña.'],
        ['03','XSS basado en DOM','Consigue que la búsqueda ejecute código y muestre el token de sesión. Después, decodifícalo.'],
        ['04','XSS almacenado','Crea una playlist que ejecute código al abrir Biblioteca y muestre la clave de API.'],
        ['05','IDOR','Consulta las notas privadas de otro usuario modificando el identificador del perfil.']
      ];
      const completed = readJSON('ondas_completed', []);
      shell('retos', `<div class="eyebrow">Aprende haciendo</div><h1 class="page-title">Laboratorio de seguridad</h1><p class="page-subtitle">Cinco retos prácticos para descubrir fallos habituales en aplicaciones web.</p>
        <div class="quick-stats" style="max-width:650px"><div class="stat-card"><div class="stat-icon">${icon('shield')}</div><div><strong>05</strong><span>Retos disponibles</span></div></div><div class="stat-card"><div class="stat-icon">${icon('spark')}</div><div><strong id="completed-count">${completed.length}/5</strong><span>Retos completados</span></div></div><div class="stat-card"><div class="stat-icon">${icon('clock')}</div><div><strong>Local</strong><span>Entorno de prácticas</span></div></div></div>
        <div class="challenge-grid">${challenges.map((challenge, index) => `<article class="challenge-card"><div class="challenge-top"><span class="challenge-number">RETO ${challenge[0]}</span><span class="challenge-status ${completed.includes(index) ? 'done' : ''}">${completed.includes(index) ? '✓ COMPLETADO' : 'PENDIENTE'}</span></div><h3>${challenge[1]}</h3><p>${challenge[2]}</p></article>`).join('')}</div>
        <section class="section panel" style="max-width:760px"><div class="eyebrow">Valida tu progreso</div><h2 style="font:600 18px 'Space Grotesk';margin:7px 0">Comprobar una bandera</h2><p class="page-subtitle" style="margin:0 0 16px">Introduce el texto completo con el formato <code>FLAG{...}</code>.</p>
          <form id="flag-form" class="form-row" style="margin:0"><input class="field" id="flag-input" placeholder="FLAG{...}" autocomplete="off"><button class="btn btn-primary" type="submit">Comprobar</button></form><p id="flag-result" class="message"></p></section>
        <div class="hint-box"><h3>${icon('spark',15)} Pistas para empezar</h3><p>• La pestaña <code>Sources</code> permite inspeccionar el código JavaScript.</p><p>• Revisa <code>Application → Local Storage</code> para encontrar datos guardados por la web.</p><p>• En búsquedas y perfiles, presta atención a cómo cambia la URL.</p><p>• Recuerda: una aplicación real debe validar identidades, permisos y datos en el servidor, no confiar en el navegador.</p></div>`);
      const flags = [
        'RkxBR3tlbF9jb2RpZ29fZnVlbnRlX2xvX3ZlX3RvZG99',
        'RkxBR3tlbF9yb2xfbm9fc2VfZ3VhcmRhX2VuX2VsX2NsaWVudGV9',
        'RkxBR3tkb21feHNzX2VuX2xhX2J1c3F1ZWRhfQ==',
        'RkxBR3t4c3NfYWxtYWNlbmFkb19lbl9wbGF5bGlzdHN9',
        'RkxBR3tpZG9yX2VuX2VsX3BlcmZpbH0='
      ];
      $('#flag-form').onsubmit = event => {
        event.preventDefault();
        const value = $('#flag-input').value.trim();
        let encoded = ''; try { encoded = btoa(value); } catch (error) { encoded = ''; }
        const index = flags.indexOf(encoded);
        const result = $('#flag-result');
        if (index >= 0) {
          const done = readJSON('ondas_completed', []);
          if (!done.includes(index)) done.push(index);
          store.setItem('ondas_completed', JSON.stringify(done));
          result.className = 'message success';
          result.textContent = `¡Correcto! Has completado el reto ${index + 1}.`;
          const completedCount = $('#completed-count'); if (completedCount) completedCount.textContent = `${done.length}/5`;
          const status = document.querySelectorAll('.challenge-status')[index]; if (status) { status.textContent = '✓ COMPLETADO'; status.classList.add('done'); }
          notify(`Reto ${index + 1} completado.`);
        } else {
          result.className = 'message error';
          result.textContent = 'Esa bandera no es válida. Revisa el reto e inténtalo de nuevo.';
        }
      };
    }

    function render() {
      if (!getSession()) return viewLogin();
      let hash = location.hash.slice(1);
      try { hash = decodeURIComponent(hash); } catch (error) { /* Se conserva el hash original. */ }
      if (hash.startsWith('q=')) return viewSearch(hash.slice(2));
      if (hash.startsWith('perfil=')) return viewProfile(parseInt(hash.slice(7), 10));
      if (hash.startsWith('playlist=')) return viewPlaylist(parseInt(hash.slice(9), 10));
      const routes = {
        inicio: viewHome,
        buscar: () => viewSearch(''),
        biblioteca: viewLibrary,
        favoritas: viewFavourites,
        admin: viewAdmin,
        retos: viewChallenges
      };
      (routes[hash] || viewHome)();
    }

    addEventListener('beforeunload', rememberTrack);
    addEventListener('hashchange', () => { activeGenre = 'Todos'; render(); });
    addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (event.key === 'Escape') { $('#settings-backdrop')?.classList.remove('open'); }
      if (typing || !getSession()) return;
      if (event.key === '/' ) { event.preventDefault(); location.hash = '#buscar'; setTimeout(() => $('#search-query')?.focus(), 80); }
      if (event.code === 'Space') { event.preventDefault(); playing = !playing; tick(); rememberTrack(); drawPlayer(); }
      if (event.key === 'ArrowRight' && event.altKey) { event.preventDefault(); nextTrack(); }
      if (event.key === 'ArrowLeft' && event.altKey) { event.preventDefault(); previousTrack(); }
    });
    $('#settings-backdrop')?.addEventListener('click', event => { if (event.target.id === 'settings-backdrop') event.currentTarget.classList.remove('open'); });
    applySettings();
    const savedPlayer = readJSON('ondas_player_state', null);
    if (savedPlayer && Number.isInteger(savedPlayer.track) && TRACKS[savedPlayer.track]) { currentTrack = savedPlayer.track; position = Math.max(0, Math.min(TRACKS[currentTrack][2], Number(savedPlayer.position) || 0)); }
    render();
  </script>
</body>
</html>
